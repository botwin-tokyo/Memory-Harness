[project]
name = "memory-ingest"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
description = "Automated grounded-memory ingestion: source in (URL/file), linked chunked neutral artifacts out"
requires-python = ">=3.11"
dependencies = [
    "memory-fleet>=0.1,<1",
  "python-multipart>=0.0.9",
    "fastapi>=0.110,<1",
    "uvicorn>=0.30,<1",
    "httpx[http2]>=0.27,<1",
    "pydantic>=2.7,<3",
    "pymupdf>=1.24,<2",
    "beautifulsoup4>=4.12,<5",
    "pillow>=10,<12",
    "python-docx>=1.1,<2",
    "memory-contract>=0.1,<1",
]

[project.scripts]
memory-ingest = "memory_ingest.server:main"
memory-convo-sync = "memory_ingest.convo.cli:main"
seed = "memory_ingest.seed.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memory_ingest*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["memory_ingest"]
mypy_path = "../contract"
ignore_missing_imports = true
