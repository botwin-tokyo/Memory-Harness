[project]
name = "memory-fleet"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
description = "Fleet telemetry publisher — health + metrics from every service to the WebSocket hub"
requires-python = ">=3.11"
dependencies = [
    "memory-contract>=0.1,<1",
    "websockets>=13,<17",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10"]

[project.scripts]
memory-fleet-register = "memory_fleet.register:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memory_fleet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["memory_fleet"]
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "memory_harness.*",
    "memory_ingest.*",
    "memory_mcp.*",
    "websockets.*",
]
ignore_missing_imports = true
