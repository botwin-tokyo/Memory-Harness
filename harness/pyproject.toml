[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-harness"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
description = "Centralized, model-agnostic memory service — the harness node"
requires-python = ">=3.11"
dependencies = [
    "memory-fleet>=0.1,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlite-vec>=0.1.6,<1",
    "uuid6>=2024.1.0,<2026",
    "prometheus-client>=0.20,<1",
    "httpx>=0.27,<1",
    "memory-contract>=0.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
]

[project.scripts]
memory-harness = "memory_harness.main:run"

[tool.hatch.build.targets.wheel]
packages = ["memory_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
packages = ["memory_harness"]
mypy_path = "../contract:../fleet"
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true
