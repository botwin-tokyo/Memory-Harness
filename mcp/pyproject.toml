[project]
name = "memory-mcp"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
description = "MCP server wrapping the memory-harness HTTP API — memory access through native agent tools"
requires-python = ">=3.11"
dependencies = [
    "memory-contract>=0.1,<1",
    "memory-fleet>=0.1,<1",
    "mcp>=1.28,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memory_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
packages = ["memory_mcp"]
mypy_path = "../contract"
ignore_missing_imports = true

[project.scripts]
memory-mcp = "memory_mcp.server:main"
